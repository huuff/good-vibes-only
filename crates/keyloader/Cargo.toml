[package]
name = "keyloader"
version.workspace = true
edition.workspace = true
description = "Discover GPG and SSH keys in 1Password and load them into gpg-agent and ssh-agent"
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
linux-keyutils = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
