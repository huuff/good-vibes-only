<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16241f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Habits</title>
    <!-- Root-relative PWA files; present once web/ is copied into the build
         output root (see README). During `dx serve` they 404, harmlessly.
         Styles live in assets/style.css so dx serve hot-reloads them; edits
         to THIS file need a dx serve restart. -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
