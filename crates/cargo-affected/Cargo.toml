[package]
name = "cargo-affected"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Find changed Cargo workspace packages and their transitive dependents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
toml = "0.8"
